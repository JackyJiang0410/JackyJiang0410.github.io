<div class="publications"><ol>{% for pub in site.data.publications.main %}<li><div class="title">{% if pub.link %}<a href="{{ pub.link }}">{{ pub.title }}</a>{% else %}{{ pub.title }}{% endif %}</div><div class="author">{{ pub.authors }}</div><div class="periodical"><em>{{ pub.journal }}</em>{% if pub.year %} ({{ pub.year }}){% endif %}</div>{% if pub.arxiv %}<div class="links"><a href="{{ pub.arxiv }}">arXiv</a></div>{% endif %}</li>{% endfor %}</ol></div>
